name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile windows_event_analyzer.py tests/test_windows_event_analyzer.py
      - name: Run unit tests
        run: python -W error -m unittest discover -s tests -v
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @(
            "$PWD/collect_windows_events.ps1",
            "$PWD/generate_safe_activity.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$parseErrors
            )
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List
            exit 1
          }
